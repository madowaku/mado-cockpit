name: OpenDots Browser E2E

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/opendots-browser-e2e.yml"
      - "integrations/opendots/e2e/**"
      - "integrations/opendots/overlay/**"
      - "src/mado_cockpit/opendots_browser_e2e.py"
      - "src/mado_cockpit/opendots_dogfood.py"
      - "src/mado_cockpit/opendots_tools.py"
      - "tests/test_opendots_browser_e2e.py"

permissions:
  contents: read

jobs:
  human-gate-clickthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout mado-cockpit
        uses: actions/checkout@v4
        with:
          path: cockpit

      - name: Checkout real OpenDots
        uses: actions/checkout@v4
        with:
          repository: CopilotKit/OpenDots
          ref: main
          path: opendots

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: opendots/package-lock.json

      - name: Install Cockpit
        working-directory: cockpit
        run: pip install -e ".[dev]"

      - name: Apply browser overlay and create Human Gate fixture
        working-directory: cockpit
        run: |
          python -m mado_cockpit.opendots_browser_e2e \
            --opendots-root ../opendots \
            --apply \
            --fixture | tee /tmp/m1.6-setup.json
          OPERATOR_ID="$(python -c "import json; print(json.load(open('/tmp/m1.6-setup.json'))['fixture']['operator_id'])")"
          GATE_ID="$(python -c "import json; print(json.load(open('/tmp/m1.6-setup.json'))['fixture']['gate_id'])")"
          echo "MADO_E2E_OPERATOR_ID=$OPERATOR_ID" >> "$GITHUB_ENV"
          echo "MADO_E2E_GATE_ID=$GATE_ID" >> "$GITHUB_ENV"

      - name: Validate browser patch cleanliness
        working-directory: opendots
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Install OpenDots dependencies
        working-directory: opendots
        run: npm ci

      - name: Typecheck browser overlay
        working-directory: opendots
        run: npm run typecheck

      - name: Build real OpenDots
        working-directory: opendots
        run: npm run build

      - name: Install Chromium
        working-directory: opendots
        run: npx playwright install --with-deps chromium

      - name: Start real OpenDots
        working-directory: opendots
        env:
          NODE_ENV: production
          DATABASE_PATH: /tmp/opendots-m1.6.sqlite
          INTELLIGENCE_API_KEY: mcc-m1.6-local-fixture
          OPENAI_API_KEY: mcc-m1.6-local-fixture
          OPENAI_MODEL: mcc-m1.6-local-fixture
          MADO_COCKPIT_ROOT: ${{ github.workspace }}/cockpit
          MADO_COCKPIT_PYTHON: python
          MADO_COCKPIT_E2E: "1"
        run: |
          npm start > /tmp/opendots-m1.6-server.log 2>&1 &
          echo "$!" > /tmp/opendots-m1.6-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4310/api/state >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/opendots-m1.6-server.log
          exit 1

      - name: Run Chromium Human Gate clickthrough
        working-directory: opendots
        env:
          MADO_E2E_BASE_URL: http://127.0.0.1:4310
          MADO_E2E_OPERATOR_ID: ${{ env.MADO_E2E_OPERATOR_ID }}
          MADO_E2E_EVIDENCE_DIR: ${{ github.workspace }}/cockpit/.mado/cockpit/integrations/opendots/browser-e2e/${{ github.run_id }}
        run: |
          mkdir -p "$MADO_E2E_EVIDENCE_DIR"
          npx tsx scripts/mado-browser-e2e.ts | tee "$MADO_E2E_EVIDENCE_DIR/browser-result.json"
          cp /tmp/opendots-m1.6-server.log "$MADO_E2E_EVIDENCE_DIR/server.log"

      - name: Verify Cockpit state after browser click
        working-directory: cockpit
        run: |
          python -m mado_cockpit.opendots_browser_e2e \
            --opendots-root ../opendots \
            --assert-resolved "$MADO_E2E_OPERATOR_ID" \
            | tee ".mado/cockpit/integrations/opendots/browser-e2e/${{ github.run_id }}/cockpit-final.json"

      - name: Stop OpenDots
        if: always()
        run: |
          if [ -f /tmp/opendots-m1.6-server.pid ]; then
            kill "$(cat /tmp/opendots-m1.6-server.pid)" || true
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opendots-browser-e2e-evidence
          path: |
            cockpit/.mado/cockpit/integrations/opendots/browser-e2e/
            /tmp/m1.6-setup.json
            /tmp/opendots-m1.6-server.log
          if-no-files-found: warn
