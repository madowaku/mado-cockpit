name: MCC-M2.7.1 PydanticAI Local Probe

on:
  pull_request:
    paths:
      - "src/mado_cockpit/pydanticai_probe.py"
      - "src/mado_cockpit/substrate_lab.py"
      - "tests/test_pydanticai_probe.py"
      - "scripts/pydanticai_probe_smoke.py"
      - "fixtures/substrate/**"
      - "pyproject.toml"
      - ".github/workflows/pydanticai-local-probe.yml"
  workflow_dispatch:

jobs:
  local-testmodel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Defense in depth: no API credentials are provided to the job.
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal provider-free test stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pydanticai-probe]"
          python -m pip show pydantic-ai-slim
      - name: Run actual local PydanticAI contract tests
        run: pytest -q tests/test_pydanticai_probe.py
      - name: Run full project tests
        run: pytest -q
      - name: Run offline local dogfood
        run: python scripts/pydanticai_probe_smoke.py
