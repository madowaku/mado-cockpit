name: ChatGPT MCP Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/chatgpt-mcp-bridge.yml"
      - "src/mado_cockpit/mcp_server.py"
      - "src/mado_cockpit/opendots_tools.py"
      - "src/mado_cockpit/opendots.py"
      - "scripts/mcp_http_smoke.py"
      - "tests/test_mcp_server.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  streamable-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Start MCP server
        run: |
          mkdir -p .mado/m2.0
          mado-cockpit-mcp             --root .             --host 127.0.0.1             --port 8787             > .mado/m2.0/server.log 2>&1 &
          echo "$!" > .mado/m2.0/server.pid

      - name: Official MCP Client HTTP smoke
        run: |
          set -o pipefail
          for attempt in $(seq 1 30); do
            if python scripts/mcp_http_smoke.py               --url http://127.0.0.1:8787/mcp               | tee .mado/m2.0/http-smoke.json; then
              exit 0
            fi
            sleep 0.5
          done
          echo "----- MCP server log -----"
          cat .mado/m2.0/server.log || true
          exit 1

      - name: Stop MCP server
        if: always()
        run: |
          if [ -f .mado/m2.0/server.pid ]; then
            kill "$(cat .mado/m2.0/server.pid)" || true
          fi

      - name: Upload M2.0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-mcp-bridge-evidence
          path: .mado/m2.0/
          if-no-files-found: error
