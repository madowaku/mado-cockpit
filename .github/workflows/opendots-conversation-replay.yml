name: OpenDots Conversation Replay

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/opendots-conversation-replay.yml"
      - "integrations/opendots/replay/**"
      - "integrations/opendots/overlay/**"
      - "src/mado_cockpit/opendots_conversation_replay.py"
      - "src/mado_cockpit/opendots_dogfood.py"
      - "src/mado_cockpit/opendots_tools.py"
      - "tests/test_opendots_conversation_replay.py"

permissions:
  contents: read

jobs:
  deterministic-conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout mado-cockpit
        uses: actions/checkout@v4
        with:
          path: cockpit

      - name: Checkout real OpenDots
        uses: actions/checkout@v4
        with:
          repository: CopilotKit/OpenDots
          ref: main
          path: opendots

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: opendots/package-lock.json

      - name: Install Cockpit
        working-directory: cockpit
        run: pip install -e ".[dev]"

      - name: Apply real OpenDots overlay and create replay fixture
        working-directory: cockpit
        run: |
          python -m mado_cockpit.opendots_conversation_replay \
            --opendots-root ../opendots \
            --apply \
            --fixture | tee /tmp/m1.7-setup.json
          OPERATOR_ID="$(python -c "import json; print(json.load(open('/tmp/m1.7-setup.json'))['fixture']['operator_id'])")"
          GATE_ID="$(python -c "import json; print(json.load(open('/tmp/m1.7-setup.json'))['fixture']['gate_id'])")"
          echo "MADO_REPLAY_OPERATOR_ID=$OPERATOR_ID" >> "$GITHUB_ENV"
          echo "MADO_REPLAY_GATE_ID=$GATE_ID" >> "$GITHUB_ENV"

      - name: Validate overlay cleanliness
        working-directory: opendots
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Install OpenDots dependencies
        working-directory: opendots
        run: npm ci

      - name: Typecheck real OpenDots plus replay
        working-directory: opendots
        run: npm run typecheck

      - name: Run deterministic real conversation
        working-directory: opendots
        env:
          MADO_COCKPIT_ROOT: ${{ github.workspace }}/cockpit
          MADO_COCKPIT_PYTHON: python
          MADO_REPLAY_OPERATOR_ID: ${{ env.MADO_REPLAY_OPERATOR_ID }}
          MADO_REPLAY_EVIDENCE_PATH: ${{ github.workspace }}/cockpit/.mado/cockpit/integrations/opendots/conversation-replay/${{ github.run_id }}/conversation-replay.json
        run: |
          mkdir -p "$(dirname "$MADO_REPLAY_EVIDENCE_PATH")"
          npx tsx scripts/mado-conversation-replay.ts \
            | tee "$MADO_REPLAY_EVIDENCE_PATH.stdout"

      - name: Verify Cockpit state after replay
        working-directory: cockpit
        run: |
          python -m mado_cockpit.opendots_conversation_replay \
            --opendots-root ../opendots \
            --assert-resolved "$MADO_REPLAY_OPERATOR_ID" \
            | tee ".mado/cockpit/integrations/opendots/conversation-replay/${{ github.run_id }}/cockpit-final.json"

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opendots-conversation-replay-evidence
          path: |
            cockpit/.mado/cockpit/integrations/opendots/conversation-replay/
            /tmp/m1.7-setup.json
          if-no-files-found: warn
