name: Artemis mobile QA offline gate
on:
  push:
    branches:
      - feature/mcc-m2-9-artemis-mobile-qa
  pull_request:
    paths:
      - "src/mado_cockpit/artemis_mobile_qa.py"
      - "tests/test_artemis_mobile_qa.py"
      - ".github/workflows/artemis-mobile-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_artemis_mobile_qa.py
