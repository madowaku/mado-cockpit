name: Design Bake-off Browser Proof

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-fixture-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install playwright==1.57.0
      - name: Real Chromium loopback screenshot smoke
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            python scripts/design_bakeoff_browser_smoke.py --browser-channel chrome
          elif command -v chromium >/dev/null 2>&1; then
            python scripts/design_bakeoff_browser_smoke.py --browser-executable "$(command -v chromium)"
          else
            # Browser install occurs only in this explicit CI job, never by the application.
            python -m playwright install --with-deps chromium
            python scripts/design_bakeoff_browser_smoke.py
          fi
      - name: Three distinct manually authored UI directions and hard decision hold
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            python scripts/design_quality_gate_browser_smoke.py --browser-channel chrome
          elif command -v chromium >/dev/null 2>&1; then
            python scripts/design_quality_gate_browser_smoke.py --browser-executable "$(command -v chromium)"
          else
            python scripts/design_quality_gate_browser_smoke.py
          fi
      - name: Upload real manual-design decision proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakeoff-manual-directions-decision-proof
          path: .mado/real-ui-decision-fixture/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Upload actual fixture screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakeoff-real-browser-fixture-proof
          path: .mado/bakeoff-proof/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
