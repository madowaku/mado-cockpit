name: OpenUI Adaptive Cockpit Lab
on:
  push:
    branches: [main]
    paths:
      - "integrations/openui-lab/**"
      - ".github/workflows/openui-lab.yml"
  pull_request:
    paths:
      - "integrations/openui-lab/**"
      - ".github/workflows/openui-lab.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/openui-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
