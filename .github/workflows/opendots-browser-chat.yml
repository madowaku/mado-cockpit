name: OpenDots Browser Chat

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/opendots-browser-chat.yml"
      - "integrations/opendots/chat-shim/**"
      - "integrations/opendots/overlay/**"
      - "fixtures/opendots/mcc-m1.9-upstream-lock.json"
      - "src/mado_cockpit/opendots_browser_chat.py"
      - "src/mado_cockpit/opendots_dogfood.py"
      - "src/mado_cockpit/opendots_tools.py"
      - "tests/test_opendots_browser_chat.py"

permissions:
  contents: read

jobs:
  normal-chat-clickthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout mado-cockpit
        uses: actions/checkout@v4
        with:
          path: cockpit

      - name: Checkout real OpenDots
        uses: actions/checkout@v4
        with:
          repository: CopilotKit/OpenDots
          ref: main
          path: opendots

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: opendots/package-lock.json

      - name: Install Cockpit
        working-directory: cockpit
        run: pip install -e ".[dev]"

      - name: Apply M1.9 overlay and create Cockpit fixture
        working-directory: cockpit
        run: |
          set -o pipefail
          python -m mado_cockpit.opendots_browser_chat \
            --opendots-root ../opendots \
            --apply \
            --fixture | tee /tmp/m1.9-setup.json
          OPERATOR_ID="$(python -c "import json; print(json.load(open('/tmp/m1.9-setup.json'))['fixture']['operator_id'])")"
          GATE_ID="$(python -c "import json; print(json.load(open('/tmp/m1.9-setup.json'))['fixture']['gate_id'])")"
          echo "MADO_M1_9_OPERATOR_ID=$OPERATOR_ID" >> "$GITHUB_ENV"
          echo "MADO_M1_9_GATE_ID=$GATE_ID" >> "$GITHUB_ENV"

      - name: Validate overlay cleanliness
        working-directory: opendots
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Install OpenDots dependencies
        working-directory: opendots
        run: npm ci

      - name: Typecheck real OpenDots plus M1.9
        working-directory: opendots
        run: npm run typecheck

      - name: Build real OpenDots
        working-directory: opendots
        run: npm run build

      - name: Install Chromium
        working-directory: opendots
        run: npx playwright install --with-deps chromium

      - name: Start normal OpenDots with deterministic local runtime
        working-directory: opendots
        env:
          NODE_ENV: production
          DATABASE_PATH: /tmp/opendots-m1.9.sqlite
          OPENAI_API_KEY: mcc-m1.9-local
          OPENAI_MODEL: mcc-m1.9-deterministic
          OPENAI_BASE_URL: http://127.0.0.1:4310/api/mado-chat-shim/v1
          MADO_DETERMINISTIC_CHAT: "1"
          MADO_M1_9_OPERATOR_ID: ${{ env.MADO_M1_9_OPERATOR_ID }}
          MADO_COCKPIT_ROOT: ${{ github.workspace }}/cockpit
          MADO_COCKPIT_PYTHON: python
        run: |
          npm start > /tmp/opendots-m1.9-server.log 2>&1 &
          echo "$!" > /tmp/opendots-m1.9-server.pid
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4310/api/state >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/opendots-m1.9-server.log
          exit 1

      - name: Run normal Chat Chromium clickthrough
        working-directory: opendots
        env:
          MADO_M1_9_BASE_URL: http://127.0.0.1:4310
          MADO_M1_9_OPERATOR_ID: ${{ env.MADO_M1_9_OPERATOR_ID }}
          MADO_M1_9_EVIDENCE_DIR: ${{ github.workspace }}/cockpit/.mado/cockpit/integrations/opendots/browser-chat/${{ github.run_id }}
        run: |
          set -o pipefail
          mkdir -p "$MADO_M1_9_EVIDENCE_DIR"
          npx tsx scripts/mado-browser-chat-e2e.ts \
            | tee "$MADO_M1_9_EVIDENCE_DIR/browser-chat-result.json"
          cp /tmp/opendots-m1.9-server.log "$MADO_M1_9_EVIDENCE_DIR/server.log"

      - name: Verify Cockpit state after normal Chat
        working-directory: cockpit
        run: |
          set -o pipefail
          python -m mado_cockpit.opendots_browser_chat \
            --opendots-root ../opendots \
            --assert-resolved "$MADO_M1_9_OPERATOR_ID" \
            | tee ".mado/cockpit/integrations/opendots/browser-chat/${{ github.run_id }}/cockpit-final.json"

      - name: Dump OpenDots server log on failure
        if: failure()
        run: |
          echo "----- OpenDots M1.9 server log -----"
          cat /tmp/opendots-m1.9-server.log || true

      - name: Stop OpenDots
        if: always()
        run: |
          if [ -f /tmp/opendots-m1.9-server.pid ]; then
            kill "$(cat /tmp/opendots-m1.9-server.pid)" || true
          fi

      - name: Upload browser Chat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opendots-browser-chat-evidence
          path: |
            cockpit/.mado/cockpit/integrations/opendots/browser-chat/
            /tmp/m1.9-setup.json
            /tmp/opendots-m1.9-server.log
          if-no-files-found: warn
