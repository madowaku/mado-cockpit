[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mado-cockpit"
version = "0.1.0"
description = "Agent execution plane for MADO SYSTEM ONE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
space = ["mcp>=2.0,<3"]
dev = ["pytest>=8.0", "mcp>=2.0,<3"]

[project.scripts]
mado-cockpit = "mado_cockpit.cli:main"
mado-cockpit-space-mcp = "mado_cockpit.space_mcp:main"
mado-cockpit-tunnel = "mado_cockpit.tunnel_cli:main"
mado-cockpit-space-dogfood = "mado_cockpit.dogfood_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
