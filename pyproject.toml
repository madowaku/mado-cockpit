[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mado-cockpit"
version = "0.1.0"
description = "Production control plane for MADO SYSTEM ONE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
semantic = ["sentence-transformers[image]>=6.1.0", "transformers"]

[project.scripts]
mado-cockpit = "mado_cockpit.cli:main"
mado-cockpit-mcp = "mado_cockpit.mcp_server:main"
mado-cockpit-semantic = "mado_cockpit.semantic_index:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
